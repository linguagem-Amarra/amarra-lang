name: Testar Studio 3D e publicar interface 2D

on:
  push:
    branches: [main, codex/interface-visual-nos]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-studio.txt
      - run: python gerar.py
      - run: python -m unittest discover -s tests
      - run: node tests/test_movimentos.mjs
      - name: Instalar dependências do Studio 3D
        run: npm ci
        working-directory: web/studio
      - name: Testar Studio 3D
        run: npm test
        working-directory: web/studio
      - name: Construir Studio 3D
        run: npm run build
        working-directory: web/studio
      - uses: actions/upload-artifact@v4
        with:
          name: studio-3d
          path: web/studio/dist
      - run: python scripts/construir_web.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
